# A throwaway CrossWatch for testing this add-on against.
#
# Deliberately NOT connected to Trakt, Simkl, Plex or MDBList. A test scrobble reaching a
# real account writes into real watch history, and nothing here is worth that risk. Make
# test accounts if the providers ever need exercising.
#
# The image is pinned by digest rather than :latest, so what we verified against cannot
# change under us on the next pull. Bump it deliberately.
services:
  crosswatch-test:
    # CrossWatch v0.13.6. v0.13.5 was the first release that sends people (contract 1.6).
    image: ghcr.io/cenodude/crosswatch@sha256:c5f4b0cce00a5451339b48efae14aaed89e8c26c3b565fc184a320170b678db5
    container_name: crosswatch-test
    ports:
      - "127.0.0.1:${CROSSWATCH_TEST_PORT:-8787}:8787"
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - crosswatch_release_config:/config
    # No restart policy: this is a test rig and should not come back on its own after a
    # reboot, quietly polling a Kodi nobody is watching.
    restart: "no"

volumes:
  # Separate from the volume the development builds used, so a release never opens data a
  # development build wrote.
  crosswatch_release_config:

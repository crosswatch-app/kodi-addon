[project]
site_name = "CrossWatch for Kodi"
site_description = "A Kodi add-on that reports what you watch, and who watched it, to your own CrossWatch."
site_url = "https://crosswatch-app.github.io/kodi-addon/"
repo_url = "https://github.com/crosswatch-app/kodi-addon"
repo_name = "crosswatch-app/kodi-addon"
edit_uri = "edit/main/docs/"
copyright = "CrossWatch for Kodi, GPL-2.0-only"
extra_css = ["stylesheets/extra.css"]
docs_dir = "docs"
# Under build/, which git ignores, so a local build never lands in a commit or the zip.
site_dir = "build/site"
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "install.md" },
    { "Quick start" = "quick-start.md" },
    { "Connect to CrossWatch" = "connect.md" },
  ] },
  { "Using it" = [
    { "Who watched" = "who-watched.md" },
    { "Viewers" = "viewers.md" },
    { "Remembered answers" = "remembered-answers.md" },
  ] },
  { "Reference" = [
    { "Settings" = "settings.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "What the add-on sends" = "what-is-sent.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/icon.png"
favicon = "assets/icon.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

# Dark first, as CrossWatch and the add-on's own windows are; light is one click away.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/crosswatch-app/kodi-addon"

[project.plugins.glightbox]
auto_caption = false

# The payload contract is CrossWatch's maintainer's document for developers, not a user
# page; it stays in docs/ and is read on GitHub.
[project.plugins.exclude]
glob = ["contract.md"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

name: Feature request
description: Suggest a feature or improvement for the CrossWatch add-on for Kodi
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for CrossWatch itself go to the [CrossWatch issue tracker](https://github.com/cenodude/CrossWatch/issues).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should the add-on do?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does it solve for your household?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried, or other approaches
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false

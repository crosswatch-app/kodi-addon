name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags: a tag can be repointed at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The Kodi Omega floor, not the newest interpreter. Passing here has to mean
          # passing on the version the addon actually runs under.
          python-version: "3.11"
      # The lock carries the full transitive closure with hashes, so a republished or
      # swapped artifact fails the build instead of running inside it.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: pyright
      - run: vulture
      - run: pytest -q

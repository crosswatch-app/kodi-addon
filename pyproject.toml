# Dev tooling configuration only. Excluded from the packaged Kodi addon zip.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=resources/lib --cov-report=term-missing"

[tool.coverage.run]
source = ["resources/lib"]
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
# Raised in the verification task once the adapters exist; it only ever goes up.
fail_under = 0

[tool.vulture]
paths = ["resources/lib"]
min_confidence = 80
